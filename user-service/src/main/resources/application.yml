server:
  port: 8081

spring:
  docker:
    compose:
      enabled: false
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5434/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/user
    connect-retries: 3
    connect-retries-interval: 5s
    baseline-on-migrate: true
